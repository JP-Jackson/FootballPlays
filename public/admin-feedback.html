<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feedback · Football Plays</title>
<link rel="icon" href="/brand/jp-logo.svg">
<link rel="stylesheet" href="/shell.css">
<style>
  .wrap{max-width:1080px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
  .stats{display:flex;gap:10px;flex-wrap:wrap}
  .stat{flex:1;min-width:118px;background:#fff;border:1px solid var(--line);border-radius:var(--r);
        padding:13px 15px;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .stat.new b{color:var(--turf-dk)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .item{border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item-hd{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;cursor:pointer}
  .item-hd:hover{background:#f7fafc}
  .item-main{flex:1;min-width:0}
  .item-msg{font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
  .item-meta{font-size:12px;color:var(--muted);margin-top:5px}
  .item-meta b{color:var(--ink)}
  .chip{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
        padding:3px 9px;border-radius:999px;white-space:nowrap}
  .chip.bug{background:#fdecec;color:#8d1018}
  .chip.idea{background:#e9f6ee;color:#1d5c37}
  .chip.other{background:#eef2f7;color:#4a5866}
  .st{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;
      border-radius:999px;white-space:nowrap}
  .st-New{background:#fff4e0;color:#8a5a10}
  .st-Investigating{background:#e8effa;color:#1d3557}
  .st-InProgress{background:#e8effa;color:#1d3557}
  .st-Resolved{background:#e9f6ee;color:#1d5c37}
  .st-NotPlanned{background:#eef2f7;color:#6b7a8c}
  .detail{padding:0 15px 16px 15px;background:#fbfcfe;border-top:1px solid var(--line)}
  .detail.hide{display:none}
  .tl{list-style:none;margin:12px 0 0;padding:0;border-left:2px solid var(--line);padding-left:14px}
  .tl li{margin-bottom:11px;font-size:13px}
  .tl .when{color:var(--muted);font-size:11.5px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .row select{width:auto;min-width:170px}
  .note-row{display:flex;gap:8px;margin-top:10px}
  .note-row input{flex:1}
  .empty{padding:32px 16px;text-align:center;color:var(--muted)}
  .notify code{background:#eef2f7;padding:2px 6px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<header class="topbar"></header>
<main class="wrap">
  <div class="stats" id="stats"></div>

  <section class="panel notify">
    <div class="panel-hd"><h2>Email notifications</h2></div>
    <div class="panel-bd">
      <label for="notify" style="font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">Send new feedback to</label>
      <div class="row" style="margin-top:5px">
        <input type="text" id="notify" placeholder="you@example.com, someone@else.com" style="flex:1;min-width:240px">
        <button class="btn primary" id="save-notify">Save</button>
      </div>
      <p class="hint" id="notify-hint"></p>
      <div class="ok" id="notify-ok"></div>
      <div class="err" id="notify-err"></div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-hd">
      <h2>Feedback</h2>
      <div class="filters" style="margin-left:auto">
        <select id="filter-status" style="width:auto"><option value="">All statuses</option></select>
        <select id="filter-cat" style="width:auto"><option value="">All kinds</option></select>
      </div>
    </div>
    <div id="list"><p class="empty">Loading…</p></div>
  </section>
</main>

<script src="/shell.js"></script>
<script>
(function(){
  var api = Shell.api, esc = Shell.esc, toast = Shell.toast;
  var STATE = { feedback: [], logs: [], statuses: [], categories: [], open: null };

  var when = iso => { try { return new Date(iso).toLocaleString(); } catch(e){ return iso; } };
  var stClass = s => 'st st-' + String(s).replace(/\s+/g,'');

  async function load(){
    var d = await api('/admin/api/feedback');
    STATE.feedback = d.feedback; STATE.logs = d.logs;
    STATE.statuses = d.statuses; STATE.categories = d.categories;

    var fs = document.getElementById('filter-status');
    if (fs.options.length === 1)
      d.statuses.forEach(s => fs.add(new Option(s, s)));
    var fc = document.getElementById('filter-cat');
    if (fc.options.length === 1)
      d.categories.forEach(c => fc.add(new Option(c.label, c.key)));

    render();
  }

  function render(){
    var counts = { total: STATE.feedback.length };
    STATE.statuses.forEach(s => counts[s] = 0);
    STATE.feedback.forEach(f => { counts[f.status] = (counts[f.status]||0) + 1; });
    document.getElementById('stats').innerHTML =
      '<div class="stat new"><b>' + (counts['New']||0) + '</b><span>New</span></div>' +
      '<div class="stat"><b>' + ((counts['Investigating']||0) + (counts['In Progress']||0)) + '</b><span>Working</span></div>' +
      '<div class="stat"><b>' + (counts['Resolved']||0) + '</b><span>Resolved</span></div>' +
      '<div class="stat"><b>' + counts.total + '</b><span>All time</span></div>';

    var fStatus = document.getElementById('filter-status').value;
    var fCat = document.getElementById('filter-cat').value;
    var rows = STATE.feedback.filter(f =>
      (!fStatus || f.status === fStatus) && (!fCat || f.category === fCat));

    var box = document.getElementById('list');
    if (!rows.length){
      box.innerHTML = '<p class="empty">' +
        (STATE.feedback.length ? 'Nothing matches those filters.' : 'No feedback yet.') + '</p>';
      return;
    }

    box.innerHTML = rows.map(function(f){
      var cat = (STATE.categories.find(c => c.key === f.category) || {}).label || f.category;
      var isOpen = STATE.open === f.id;
      var mine = STATE.logs.filter(l => l.feedback_id === f.id);
      return '<article class="item">' +
        '<div class="item-hd" data-toggle="' + esc(f.id) + '">' +
          '<span class="chip ' + esc(f.category) + '">' + esc(cat) + '</span>' +
          '<div class="item-main">' +
            '<div class="item-msg">' + esc(f.message) + '</div>' +
            '<div class="item-meta"><b>' + esc(f.submitter_name) + '</b> · ' + esc(when(f.created_at)) +
              (f.page_path ? ' · from ' + esc(f.page_path) : '') + '</div>' +
          '</div>' +
          '<span class="' + stClass(f.status) + '">' + esc(f.status) + '</span>' +
        '</div>' +
        '<div class="detail' + (isOpen ? '' : ' hide') + '" data-detail="' + esc(f.id) + '">' +
          '<div class="row">' +
            '<label for="s-' + esc(f.id) + '" style="font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">Status</label>' +
            '<select id="s-' + esc(f.id) + '" data-status="' + esc(f.id) + '">' +
              STATE.statuses.map(s => '<option' + (s === f.status ? ' selected' : '') + '>' + esc(s) + '</option>').join('') +
            '</select>' +
            (f.submitter_email ? '<a class="btn sm plain" style="text-decoration:none" href="mailto:' +
                esc(f.submitter_email) + '">Reply by email</a>' : '') +
          '</div>' +
          (f.notify_status ? '<p class="hint">Notification: ' + esc(f.notify_status) + '</p>' : '') +
          '<div class="note-row">' +
            '<input type="text" placeholder="Add a note to the timeline…" data-note-input="' + esc(f.id) + '" maxlength="2000">' +
            '<button class="btn sm plain" data-note-add="' + esc(f.id) + '">Add note</button>' +
          '</div>' +
          (mine.length ? '<ul class="tl">' + mine.map(function(l){
              var what = l.note ? esc(l.note)
                : 'Status ' + esc(l.old_status || '—') + ' → <b>' + esc(l.new_status) + '</b>';
              return '<li>' + what + '<div class="when">' + esc(l.changed_by || '') + ' · ' + esc(when(l.created_at)) + '</div></li>';
            }).join('') + '</ul>'
            : '<p class="hint">No status changes or notes yet.</p>') +
        '</div></article>';
    }).join('');
  }

  document.getElementById('list').addEventListener('click', async function(e){
    var t = e.target.closest('[data-toggle]');
    if (t){ var id = t.getAttribute('data-toggle'); STATE.open = STATE.open === id ? null : id; render(); return; }

    var add = e.target.closest('[data-note-add]');
    if (add){
      var fid = add.getAttribute('data-note-add');
      var input = document.querySelector('[data-note-input="' + CSS.escape(fid) + '"]');
      var text = input.value.trim();
      if (!text) { input.focus(); return; }
      add.disabled = true;
      try {
        var r = await api('/admin/api/feedback/' + encodeURIComponent(fid) + '/note', { method:'POST', body:{ note:text } });
        STATE.logs.push(r.entry); input.value = ''; render(); toast('Note added');
      } catch (err){ toast(err.message, true); }
      finally { add.disabled = false; }
    }
  });

  document.getElementById('list').addEventListener('change', async function(e){
    var sel = e.target.closest('[data-status]');
    if (!sel) return;
    var id = sel.getAttribute('data-status');
    try {
      await api('/admin/api/feedback/' + encodeURIComponent(id), { method:'PUT', body:{ status: sel.value } });
      await load();
      toast('Status updated');
    } catch (err){ toast(err.message, true); await load(); }
  });

  ['filter-status','filter-cat'].forEach(id =>
    document.getElementById(id).addEventListener('change', render));

  document.getElementById('save-notify').addEventListener('click', async function(){
    var ok = document.getElementById('notify-ok'), err = document.getElementById('notify-err');
    ok.classList.remove('on'); err.classList.remove('on');
    try {
      await api('/admin/api/feedback/settings', { method:'PUT',
        body:{ notify_emails: document.getElementById('notify').value } });
      ok.textContent = 'Saved.'; ok.classList.add('on');
    } catch (e){ err.textContent = e.message; err.classList.add('on'); }
  });

  (async function(){
    await Shell.start('feedback');
    var s = await api('/admin/api/feedback/settings');
    document.getElementById('notify').value = s.notify_emails || '';
    document.getElementById('notify-hint').textContent = s.email_enabled
      ? 'Comma-separated. Leave empty to turn email off — feedback still saves either way.'
      : 'Email is off until the RESEND_API_KEY secret is set. Feedback still saves and shows up here.';
    await load();
  })().catch(e => { document.getElementById('list').innerHTML = '<p class="empty">' + Shell.esc(e.message) + '</p>'; });
})();
</script>
</body>
</html>
