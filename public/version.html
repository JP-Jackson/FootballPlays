<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>What's new · Football Plays</title>
<link rel="icon" href="/brand/jp-logo.svg">
<link rel="stylesheet" href="/shell.css">
<style>
  .wrap{max-width:760px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
  .now{display:flex;align-items:center;gap:14px;padding:18px}
  .now img{width:52px;height:52px;border-radius:13px;flex:none}
  .now h1{font-size:20px}
  .now p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
  .vtag{margin-left:auto;background:var(--turf-lt);color:#fff;font-weight:800;font-size:14px;
        padding:7px 14px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .rel{padding:16px 18px;border-bottom:1px solid var(--line)}
  .rel:last-child{border-bottom:0}
  .rel-hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:9px}
  .rel-hd b{font-size:15px}
  .rel-v{font-size:11px;font-weight:800;letter-spacing:.06em;background:#eef2f7;color:var(--muted);
         padding:3px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
  .rel-v.current{background:#e9f6ee;color:#1d5c37}
  .rel-date{font-size:12px;color:var(--muted);margin-left:auto}
  ul{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:6px}
  li{font-size:13.5px;line-height:1.55;color:#3d4b5a}
  .empty{padding:30px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header class="topbar"></header>
<main class="wrap">
  <section class="panel now">
    <img src="/brand/jp-logo.svg" alt="">
    <div>
      <h1>Football Plays</h1>
      <p>Every change that's shipped, newest first.</p>
    </div>
    <span class="vtag" id="vtag">…</span>
  </section>
  <section class="panel" id="releases"><p class="empty">Loading…</p></section>
</main>
<script src="/shell.js"></script>
<script>
(function(){
  (async function(){
    await Shell.start('version');
    var d = await Shell.api('/api/version');
    document.getElementById('vtag').textContent = 'v' + d.version;
    var esc = Shell.esc;
    document.getElementById('releases').innerHTML = (d.releases || []).map(function(r, i){
      return '<article class="rel">' +
        '<div class="rel-hd">' +
          '<b>' + esc(r.title) + '</b>' +
          '<span class="rel-v' + (i === 0 ? ' current' : '') + '">v' + esc(r.version) +
            (i === 0 ? ' · current' : '') + '</span>' +
          '<span class="rel-date">' + esc(r.date) + '</span>' +
        '</div>' +
        '<ul>' + (r.notes || []).map(n => '<li>' + esc(n) + '</li>').join('') + '</ul>' +
      '</article>';
    }).join('') || '<p class="empty">No releases recorded yet.</p>';
  })().catch(function(e){
    document.getElementById('releases').innerHTML =
      '<p class="empty">' + Shell.esc(e.message) + '</p>';
  });
})();
</script>
</body>
</html>
